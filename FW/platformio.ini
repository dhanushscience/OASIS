; OASIS firmware — ESP-IDF (native I2C + NimBLE, no Arduino)

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
upload_port = COM10
upload_speed = 460800

; Match the ESP-IDF version used by espressif32@6.12.0 (do not auto-upgrade).
platform_packages =
    framework-espidf @ 3.50500.0
