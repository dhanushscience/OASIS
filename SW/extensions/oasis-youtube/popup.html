<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "LED Dot-Matrix";
      src: url("fonts/LED-Dot-Matrix.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --bg: #F4FAFD;
      --ink: #161D1F;
      --muted: #6E8090;
      --line: rgba(22, 29, 31, 0.10);
      --ok: #22C55E;
      --bad: #B91C1C;
      --surface: #F4FAFD;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 300px;
      color: var(--ink);
      background:
        linear-gradient(rgba(22, 29, 31, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 29, 31, 0.06) 1px, transparent 1px),
        var(--bg);
      background-size: 20px 20px, 20px 20px, auto;
      font-family: "JetBrains Mono", Consolas, monospace;
    }

    .shell { padding: 14px; }

    .card {
      border-radius: 16px;
      background: var(--surface);
      box-shadow:
        6px 6px 14px rgba(122, 153, 171, 0.35),
        -4px -4px 10px rgba(255, 255, 255, 0.9),
        inset 0 0 0 1px rgba(255, 255, 255, 0.55);
      padding: 14px 14px 12px;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow:
        2px 2px 6px rgba(122, 153, 171, 0.35),
        -1px -1px 4px rgba(255, 255, 255, 0.9);
      background: #fff;
    }

    .titles { min-width: 0; }

    h1 {
      margin: 0 0 4px;
      font-family: "LED Dot-Matrix", "JetBrains Mono", monospace;
      font-size: 15px;
      letter-spacing: 0.08em;
      font-weight: normal;
      color: var(--ink);
      line-height: 1.1;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
      line-height: 1.35;
    }

    .field { margin: 0 0 12px; }

    .label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .label .slash { opacity: 0.55; }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 118px;
      padding: 8px 14px;
      border-radius: 999px;
      font-family: "LED Dot-Matrix", "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #fff;
      background: #9CA3AF;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.12);
    }

    .status-pill.ok { background: var(--ok); }
    .status-pill.bad { background: var(--bad); }

    .status-reason {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
      word-break: break-word;
    }

    .status-reason:empty { display: none; }

    select {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      box-shadow:
        inset 2px 2px 5px rgba(122, 153, 171, 0.28),
        inset -2px -2px 5px rgba(255, 255, 255, 0.85);
      outline: none;
      cursor: pointer;
    }

    button {
      margin-top: 4px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 11px 12px;
      background: #161D1F;
      color: #fff;
      font-family: "LED Dot-Matrix", "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(22, 29, 31, 0.18);
    }

    button:hover { background: #243238; }
    button:active { background: #0F1517; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="head">
        <img class="logo" src="APP_ICON.png" alt="OASIS" />
        <div class="titles">
          <h1>OASIS BRIDGE</h1>
          <p class="sub">Browser link for desktop automations</p>
        </div>
      </div>

      <div class="field">
        <div class="label"><span>CONNECTION</span><span class="slash">//</span></div>
        <div id="status" class="status-pill">…</div>
      </div>

      <div class="field">
        <div class="label"><span>HOLD SPEED</span><span class="slash">//</span></div>
        <select id="holdRate" aria-label="Hold playback speed">
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2" selected>2×</option>
          <option value="2.25">2.25×</option>
          <option value="2.5">2.5×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
        <p class="hint">Applied when you hold the pad button for speed boost on normal YouTube videos.</p>
      </div>

      <p id="statusReason" class="status-reason"></p>

      <button id="retry" type="button">RETRY CONNECTION</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
