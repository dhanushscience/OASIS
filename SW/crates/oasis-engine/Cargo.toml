[package]
name = "oasis-engine"
description = "The running OASIS: pad link, gestures, profile matching and actions wired into one loop, for the desktop app and the CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# This is the layer the C# app spread across OverlayService and OasisHost: it owns the one thread
# that reads the pad, runs the gesture rules, picks the profile and hands actions to a worker.
# It has no UI; the desktop app and the CLI both drive it and show its events.
[dependencies]
oasis-core = { path = "../oasis-core" }
oasis-app = { path = "../oasis-app" }
oasis-platform = { path = "../oasis-platform" }
oasis-settings = { path = "../oasis-settings" }
oasis-ble = { path = "../oasis-ble" }
oasis-models = { path = "../oasis-models" }
oasis-voice = { path = "../oasis-voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
oasis-win = { path = "../oasis-win" }

[dev-dependencies]
tungstenite = "0.26"
oasis-models = { path = "../oasis-models" }

[lints]
workspace = true
