<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS voice models</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --mute:#666; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --mute:#999; --line:#333; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; max-width:52rem; margin:0 auto; padding:2rem 1rem; }
  h1 { margin:0 0 .25rem; } p { color:var(--mute); margin:.25rem 0 1.5rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
  code { font-size:.8rem; word-break:break-all; } a { color:inherit; }
  @media (max-width:40rem) { .hash { display:none; } }
</style>
</head>
<body>
<h1>OASIS voice models</h1>
<p>The files OASIS downloads on first start. The app checks each one against the SHA-256 below. Source: <a href="https://github.com/dhanushscience/PROJECT-OASIS">dhanushscience/PROJECT-OASIS</a>. <a href="models.json">models.json</a></p>
<table>
  <thead><tr><th>File</th><th>Group</th><th>Size</th><th class="hash">SHA-256</th></tr></thead>
  <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
</table>
<script>
fetch("models.json").then(r => r.json()).then(m => {
  const mb = b => b < 1e6 ? (b / 1e3).toFixed(0) + " KB" : (b / 1e6).toFixed(1) + " MB";
  const rows = document.getElementById("rows");
  rows.textContent = "";
  for (const f of m.files) {
    const tr = rows.insertRow();
    const a = document.createElement("a");
    a.href = m.base_url + f.asset; a.textContent = f.asset;
    tr.insertCell().append(a);
    tr.insertCell().textContent = f.group;
    tr.insertCell().textContent = mb(f.bytes);
    const h = tr.insertCell(); h.className = "hash";
    const c = document.createElement("code"); c.textContent = f.sha256; h.append(c);
  }
}).catch(() => { document.getElementById("rows").innerHTML = "<tr><td colspan='4'>Could not load models.json.</td></tr>"; });
</script>
</body>
</html>
